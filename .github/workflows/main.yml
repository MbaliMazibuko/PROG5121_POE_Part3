name: Java CI

on:
  push:
    branches: [ main, master, KhanbanTasks, Part3Reports ]
  pull_request:
    branches: [ main, master, KhanbanTasks, Part3Reports ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven
        run: mvn test
